[workspace]
resolver = "2"
members = ["delta-sharing/*", "app/src-tauri"]

[workspace.package]
edition = "2021"
homepage = "https://delta.io"
keywords = ["deltalake", "delta", "datalake", "delta-sharing"]
license = "Apache-2.0"
repository = "https://github.com/delta-incubator/delta-sharing-rs"
readme = "README.md"
rust-version = "1.80"
version = "0.0.1"

[workspace.dependencies]
async-trait = "0.1.83"
bytes = { version = "1.1" }
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
# The crate is `buoyant_kernel`, a distribution of `delta_kernel`. It is depended on under the
# `delta_kernel` name so source and manifests keep the upstream import paths.
delta_kernel = { package = "buoyant_kernel", version = "0.21", features = [
    "tokio",
    "default-engine-rustls",
    "arrow",
    # Exposes Metadata/Protocol accessors that 0.21 gates behind this feature.
    "internal-api",
] }
# buoyant_kernel 0.21.200 invokes `delta_kernel_derive::parse_column_name!`, which
# buoyant_kernel_derive 1.2.0 removed. Pin the last release that still exports it.
buoyant_kernel_derive = "=1.1.0"
futures = { version = "0.3.31" }
http = { version = "1.2" }
hyper = { version = "1.6" }
object_store = { version = "0.13" }
pbjson = { version = "0.7" }
prost = { version = "0.13.3" }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tonic = { version = "0.12.3" }
tower = { version = "0.5", features = ["limit", "filter", "util"] }
tracing = { version = "0.1", features = ["log"] }
url = { version = "2.5.2", features = [
    "serde",
    "std",
], default-features = false }
