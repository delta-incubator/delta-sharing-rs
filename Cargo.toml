[workspace]
resolver = "2"
members = ["delta-sharing/*", "app/src-tauri"]

[workspace.package]
edition = "2021"
homepage = "https://delta.io"
keywords = ["deltalake", "delta", "datalake", "delta-sharing"]
license = "Apache-2.0"
repository = "https://github.com/delta-incubator/delta-sharing-rs"
readme = "README.md"
rust-version = "1.80"
version = "0.0.1"

[workspace.dependencies]
async-trait = "0.1.83"
bytes = { version = "1.1" }
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
# The kernel is `buoyant_kernel`, a distribution of `delta_kernel`. It is depended on under the
# `delta_kernel` name so source and manifests keep the upstream import paths.
delta_kernel = { package = "buoyant_kernel", version = "0.28", features = [
    "default-engine-base",
    "arrow-59",
    # Exposes Metadata/Protocol accessors that the kernel gates behind this feature.
    "internal-api",
] }
# The default engine (DefaultEngine, executors, object store wiring) is a separate crate in 0.28.
# It is depended on under the `delta_kernel_engine` name, like the kernel above.
delta_kernel_engine = { package = "buoyant_kernel_engine", version = "0.28", default-features = false, features = [
    "arrow-59",
    "rustls",
] }
futures = { version = "0.3.31" }
http = { version = "1.2" }
hyper = { version = "1.6" }
object_store = { version = "0.13" }
pbjson = { version = "0.7" }
prost = { version = "0.13.3" }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "http2",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tonic = { version = "0.12.3" }
tower = { version = "0.5", features = ["limit", "filter", "util"] }
tracing = { version = "0.1", features = ["log"] }
url = { version = "2.5.2", features = [
    "serde",
    "std",
], default-features = false }
